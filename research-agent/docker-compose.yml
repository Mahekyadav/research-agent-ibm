version: "3.9"

services:
  # ── Frontend build (one-shot) ───────────────────────────────────────────────
  frontend-build:
    image: node:20-alpine
    container_name: researchmind_frontend_build
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - ./static:/app/static
    command: sh -c "npm install && npm run build"
    profiles: ["build"]

  # ── FastAPI backend (serves API + React SPA) ────────────────────────────────
  research-agent-api:
    build: .
    container_name: researchmind_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./static:/app/static     # Serve built React frontend
    restart: unless-stopped
    depends_on:
      - chromadb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── IBM Langflow visual pipeline ─────────────────────────────────────────────
  langflow:
    image: langflowai/langflow:latest
    container_name: langflow_researchmind
    ports:
      - "7860:7860"
    volumes:
      - ./langflow:/app/flows
      - langflow_data:/app/langflow
    environment:
      - LANGFLOW_AUTO_LOGIN=true
      - LANGFLOW_SUPERUSER=admin
      - LANGFLOW_SUPERUSER_PASSWORD=researchmind123
    restart: unless-stopped

  # ── ChromaDB vector store ─────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: chroma_research
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  langflow_data:
  chroma_data:
